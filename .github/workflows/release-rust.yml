# Rust 客户端发布：推送 `rust-v*` tag（或手动 workflow_dispatch）时发布 crates.io
#
# 前置：仓库 Secrets 需配置 CRATES_IO_TOKEN（crates.io 账号 → Account Settings → API Tokens）。
# 未配置时本 workflow 仅告警跳过，不会失败。
name: release-rust

on:
  push:
    tags:
      - 'rust-v*'
  workflow_dispatch:

jobs:
  publish-crates-io:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ubuntu-latest-cargo-publish-${{ hashFiles('rust/**/Cargo.lock') }}

      - name: Run tests
        run: cargo test

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::Secret CRATES_IO_TOKEN is not set — crates.io publish skipped."
            exit 0
          fi
          # 版本已发布过则跳过（重复触发幂等）
          out=$(cargo publish --registry crates-io 2>&1) && { echo "$out"; exit 0; }
          if echo "$out" | grep -q "already exists"; then
            echo "tunely v$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2) already published — skipping."
            exit 0
          fi
          echo "$out"
          exit 1
